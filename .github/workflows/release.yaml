name: Release and deploy

env:
  BACKEND_IMAGE_NAME: nbe95/keinplan-backend
  FRONTEND_IMAGE_NAME: nbe95/keinplan-frontend

on:
  push:
    branches:
      - main

jobs:
  tag-version:
    name: Tag new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit data
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: jefflinse/pr-semver-bump@v1.7.0
        name: Bump and tag new version
        id: semver
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          major-label: major
          minor-label: minor
          patch-label: patch
          noop-labels: ""
          require-release-notes: false
          base-branch: true
          with-v: false

  docker-image-backend:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs:
      - tag-version
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract version tags
        id: version-tags
        run: |
          VERSION="${{ needs.tag-version.outputs.version }}"
          FULL_VERSION=$VERSION
          MAJOR_MINOR=$(echo $VERSION | cut -d. -f1-2)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          file: ./backend/Dockerfile
          context: ./backend/
          build-args: |
            VERSION=${{ needs.tag-version.outputs.version }}
            VERSION_SHA=${{ needs.tag-version.outputs.sha }}
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version-tags.outputs.full_version }}
            ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version-tags.outputs.major_minor }}
            ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version-tags.outputs.major }}

  docker-image-frontend:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    needs:
      - tag-version
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract version tags
        id: version-tags
        run: |
          VERSION="${{ needs.tag-version.outputs.version }}"
          FULL_VERSION=$VERSION
          MAJOR_MINOR=$(echo $VERSION | cut -d. -f1-2)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          file: ./frontend/Dockerfile
          context: ./frontend/
          build-args: |
            VERSION=${{ needs.tag-version.outputs.version }}
            VERSION_SHA=${{ needs.tag-version.outputs.sha }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version-tags.outputs.full_version }}
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version-tags.outputs.major_minor }}
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version-tags.outputs.major }}

  deploy-testing:
    name: Deploy to testing environment
    runs-on: ubuntu-latest
    needs:
      - tag-version
      - docker-image-backend
      - docker-image-frontend
    environment:
      name: testing
    steps:
      - name: Call webhook
        run: |
          curl -sIX POST --max-time 900 "${{ secrets.DEPLOYMENT_WEBHOOK }}?DEPLOY_TAG=${{ steps.version-tags.outputs.full_version }}"

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - tag-version
      - docker-image-backend
      - docker-image-frontend
    environment:
      name: production
      url: ${{ vars.DEPLOYMENT_URL }}
    steps:
      - name: Call webhook
        run: |
          curl -sIX POST --max-time 900 "${{ secrets.DEPLOYMENT_WEBHOOK }}?DEPLOY_TAG=${{ steps.version-tags.outputs.full_version }}"
