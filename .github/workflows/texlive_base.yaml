name: Build TeX Live base image

env:
  TEXLIVE_IMAGE_NAME: nbe95/keinplan-texlive

on:
  workflow_dispatch:  # only trigger manually

jobs:
  docker-image-texlive:
    name: Build texlive Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          file: ./backend/Dockerfile.texlive
          context: ./backend/
          push: true
          tags: |
            ${{ env.TEXLIVE_IMAGE_NAME }}:latest
