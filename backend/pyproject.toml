[project]
name = "KeinPlan-backend"
dynamic = ["version"]
description = "Backend for KeinPlan server."
authors = [
    {name = "Niklas Bettgen", email = "niklas@bettgen.de"},
]
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "hyperlink>=21.0.0",
    "ics>=0.7.2",
    "jinja2>=3.1.6",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.3",
    "waitress>=3.0.0",
    "flask>=3.1.1",
    "flask-cors>=4.0.1",
    "flask-restful>=0.3.10",
    "validators>=0.33.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.411",
    "pytest-asyncio>=1.4.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "waitress-serve --port 8080 src.keinplan_backend:backend"
lint = "ruff check src/"
check = { composite = ["lint", "pyright"] }
format = { composite = ["ruff format src/", "ruff check --fix src/"] }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint.isort]
known-third-party = []

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportPrivateImportUsage = false
reportConstantRedefinition = true
reportMissingTypeStubs = false
